# Sends refund-deadline reminder emails every morning.
# Also lets you run it by hand: GitHub → Actions → Daily reminders → Run workflow.

name: Daily reminders

on:
  schedule:
    # 13:00 UTC = 8 AM Eastern in winter (9 AM in summer).
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: show the emails in the log without sending them"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Send reminders
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/send-reminders.mts
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SITE_URL: https://pricedrop-buddy.vercel.app
