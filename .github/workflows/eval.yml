# Scores the receipt readers on the labelled test set.
# Scores the AI too when the AI_API_KEY secret is set.
# Run by hand: GitHub → Actions → Receipt reader score → Run workflow.
# The report appears on the run's Summary page.

name: Receipt reader score

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/lib/receipt-parser.ts"
      - "src/lib/ai-receipt.ts"
      - "tests/fixtures/**"

permissions:
  contents: read

concurrency:
  group: receipt-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Score the readers
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/eval-receipts.mts
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
